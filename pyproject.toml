[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-pipeline"
version = "0.3.1"
description = "Pipeline SDD multi-agente sobre LangGraph, con gates deterministas, CLI y panel web."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "anthropic>=0.40",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "pydantic>=2.7,<3",
]

[project.scripts]
sdd = "sdd.__main__:_console"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sdd*"]

[tool.setuptools.package-data]
sdd = ["pipeline.toml", "intake.yaml", "agents/*.md", "examples/*.py", "gates/*.py", "gates/*.toml", "static/*"]
