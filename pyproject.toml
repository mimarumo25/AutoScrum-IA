[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-pipeline"
version = "0.1.0"
description = "Pipeline SDD multi-agente: plano de control con gates deterministas, CLI y panel web en un solo comando."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "anthropic>=0.40"]

[project.scripts]
sdd = "sdd.__main__:_console"

[tool.setuptools]
packages = ["sdd"]
include-package-data = true

[tool.setuptools.package-data]
sdd = ["pipeline.toml", "intake.yaml", "agents/*.md", "examples/*.py", "gates/*.py", "gates/*.toml"]
